name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m unittest discover -s tests -v
          jwcalendar date 2028-02-29 --json
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build

  linux-desktop:
    name: GTK desktop checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop validators and GTK
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils gir1.2-adw-1 gir1.2-gtk-4.0 libxml2-utils librsvg2-bin python3-gi xvfb dbus-x11
      - name: Install app and run GTK integration checks
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
          dbus-run-session -- xvfb-run -a .venv/bin/python -m unittest discover -s tests -v
      - name: Validate desktop integration and AppStream metadata
        run: |
          desktop-file-validate data/com.jwcalendar.JWCalendar.desktop
          appstreamcli validate --no-net data/com.jwcalendar.JWCalendar.metainfo.xml
          xmllint --noout data/com.jwcalendar.JWCalendar.metainfo.xml
      - name: Render launcher icon sizes
        run: |
          rsvg-convert --width 64 --height 64 data/icons/com.jwcalendar.JWCalendar.svg --output /tmp/jw-calendar-64.png
          rsvg-convert --width 128 --height 128 data/icons/com.jwcalendar.JWCalendar.svg --output /tmp/jw-calendar-128.png
          file /tmp/jw-calendar-64.png /tmp/jw-calendar-128.png

  snap:
    name: Strict Snap build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: snapcore/action-build@v1
        id: snapcraft
      - uses: actions/upload-artifact@v6
        with:
          name: jwcalendar-snap-amd64
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
